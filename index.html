<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Free Call — NEURALX</title>
<meta name="description" content="Book a free call with NEURALX. Pick a time that works for you.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Black and white only */
:root{
  --bg:#000;
  --fg:#fff;
  --muted:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.16);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--fg);color:var(--bg);}
a{color:inherit;text-decoration:none;}
a:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:4px;}

/* Header */
.top{width:100%;max-width:1100px;margin:0 auto;padding:28px 24px;}
.logo{font-weight:800;font-size:18px;letter-spacing:.06em;}

/* Heading */
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:48px 24px 96px;}
.intro{text-align:center;margin-bottom:56px;}
h1{
  font-weight:800;
  font-size:clamp(46px,9vw,104px);
  letter-spacing:-.045em;line-height:.98;
  text-wrap:balance;
}
.lead{
  max-width:460px;margin:24px auto 0;
  font-weight:300;font-size:17px;line-height:1.7;
  color:var(--muted);text-wrap:balance;
}

/* Calendar card */
.cal-card{
  min-height:600px;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:var(--bg);
}
/* Works with any Cal.com embed code you paste inside the card */
.cal-card > div{width:100%;overflow:auto !important;}

/* Footer */
footer{border-top:1px solid var(--line);}
.foot{
  max-width:1100px;margin:0 auto;padding:40px 24px;
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:16px 56px;
  font-size:15px;
}
.f-label{color:var(--muted);font-weight:300;margin-right:10px;}
.foot a{font-weight:500;}
.foot a:hover{text-decoration:underline;text-underline-offset:5px;}

@media(max-width:640px){
  .top{padding:20px;}
  main{padding:32px 16px 64px;}
  .intro{margin-bottom:36px;}
  .lead{font-size:15px;}
  .cal-card{border-radius:18px;}
  .foot{flex-direction:column;align-items:center;gap:14px;padding:32px 20px;}
}
</style>
</head>
<body>

<header class="top">
  <span class="logo">NEURALX</span>
</header>

<main>
  <section class="intro">
    <h1>Book a free call.</h1>
    <p class="lead">Pick a time that works for you. Let’s discuss your business goals, identify growth opportunities, and explore how we can help you attract more customers, generate more leads, and grow your business.</p>
  </section>

  <div class="cal-card" id="booking">

<footer>
  <div class="foot">
    <p><span class="f-label">Email</span><a href="mailto:hello@neuralx.live">hello@neuralx.live</a></p>
    <p><span class="f-label">Instagram</span><a href="https://www.instagram.com/prashantneuralx/" target="_blank" rel="noopener noreferrer">@prashantneuralx</a></p>

</body>
</html>
